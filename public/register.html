        <div class="space-x-4 text-xs font-medium text-slate-300 flex items-center">

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <h1>Create Patient Profile</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Enter demographic details for baseline ingestion</p>
      </div>
      <form onsubmit="handleRegister(event)">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="fullName" required placeholder="Alex Miller">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="alex@hospital.org">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="input-group">
            <label>Age</label>
            <input type="number" id="age" required min="1" max="120" value="34">
          </div>
          <div class="input-group">
            <label>Gender</label>
            <select id="gender" required>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="input-group">
          <label>Birthday</label>
          <input type="date" id="birthday" required>
        </div>
        <button type="submit" class="btn-submit">Initialize Profile</button>
      </form>
      <div class="auth-footer">
        Already registered? <a href="/">Sign In</a>
      </div>
    </div>
  </div>
  <script src="/static/js/auth.js"></script>
</body>
</html>
